{% extends "base.html" %}
{% block title %}Stardew Valley{% endblock %}

{% block content %}
<div>
  <label for="property-select">Editing Property:</label>
  <select id="property-select">
  </select>
</div>

<div>
  <label for="map-select">Map:</label>
  <select id="map-select">
    <option value="farm">Farm</option>
    <option value="town">Town</option>
    <option value="beach">Beach</option>
    <option value="forest">Forest</option>
    <option value="mountain">Mountain</option>
    <option value="farmhouse">Farmhouse</option>
    <option value="seedshop">Pierre's</option>
    <option value="fishshop">Willy's</option>
    <option value="samhouse">Sam's</option>
    <option value="mines/1">Mines 1</option>
    <option value="mines/2">Mines 2</option>
    <option value="mines/3">Mines 3</option>
    <option value="mines/4">Mines 4</option>
    <option value="mines/5">Mines 5</option>
  </select>
</div>

<div id="game-holder">
  <div id="canvas-wrapper">
    <canvas id="main-canvas"></canvas>
  </div>
</div>

<script type="module" src="/static/js/editor.js"></script>
{% endblock %}
